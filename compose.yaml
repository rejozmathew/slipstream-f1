name: slipstream-f1

services:
  slipstream:
    image: slipstream-f1:local
    build:
      context: .
    ports:
      - "${SLIPSTREAM_PORT:-3444}:3444"
    environment:
      SLIPSTREAM_MODE: "${SLIPSTREAM_MODE:-full}"
    volumes:
      - "${SLIPSTREAM_RECORDINGS_DIR:-slipstream-recordings}:/data"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3444/api/v1/catalog', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  slipstream-recordings:
