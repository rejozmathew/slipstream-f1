name: slipstream-f1

services:
  slipstream:
    container_name: slipstream-f1
    image: ghcr.io/rejozmathew/slipstream-f1:latest
    pull_policy: always
    user: "99:100"
    ports:
      - "3444:3444"
    environment:
      SLIPSTREAM_MODE: "full"
      SLIPSTREAM_CATALOG_YEARS: "3"
    volumes:
      - "/mnt/user/appdata/slipstream-f1/recordings:/data"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3444/api/v1/catalog', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
