[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "slipstream-f1"
version = "0.1.0"
description = "Self-hosted Formula 1 historical timing and replay application."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Slipstream F1 contributors"}]
dependencies = [
  "aiohttp>=3.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=13",
]

[project.optional-dependencies]
dev = ["httpx2>=2.10", "pytest>=8.0", "ruff>=0.6"]
pirelli-pdf = ["pypdf>=5.0"]

[project.scripts]
slipstream = "slipstream.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/slipstream"]

